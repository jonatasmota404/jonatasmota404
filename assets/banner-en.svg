<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Jônatas Júnior — Fullstack Engineer">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#21262d"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0d1117" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="14" fill="#0d1117"/>
  <rect width="1200" height="320" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="14" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#30363d"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="64" y="92" width="44" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="150" font-size="52" font-weight="700" fill="#f0f6fc">Jônatas Júnior</text>
    <text x="64" y="192" font-size="22" fill="#8b949e">Fullstack Engineer · backend-focused</text>
  </g>
  <text x="64" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#58a6ff">node.js / typescript  ·  go  ·  php  ·  react / next.js</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">
    <rect x="736" y="96" width="400" height="184" rx="10" fill="#161b22" stroke="#30363d"/>
    <line x1="736" y1="130" x2="1136" y2="130" stroke="#30363d"/>
    <circle cx="758" cy="113" r="5" fill="#30363d"/>
    <circle cx="776" cy="113" r="5" fill="#30363d"/>
    <circle cx="794" cy="113" r="5" fill="#30363d"/>
    <text x="1116" y="118" text-anchor="end" font-size="12" fill="#6e7681">prod</text>
    <text x="760" y="168" fill="#6e7681">service</text><text x="862" y="168" fill="#c9d1d9">retifica-exacta</text>
    <text x="760" y="196" fill="#6e7681">status</text><circle cx="870" cy="192" r="4.5" fill="#3fb950"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle><text x="882" y="196" fill="#3fb950">running in production</text>
    <text x="760" y="224" fill="#6e7681">since</text><text x="862" y="224" fill="#c9d1d9">2023-11</text>
    <text x="760" y="252" fill="#6e7681">owner</text><text x="862" y="252" fill="#c9d1d9">built &amp; maintained by me</text>
    
  </g>
</svg>
